name: windows-build

# 在 GitHub 的 windows-latest(自带 MSVC)上原生编译 Windows exe。
# - 手动触发(workflow_dispatch): 产出可下载的构建产物(Artifacts), 填 tag 还会发 Release。
# - 推送 v* 标签: 自动编译并发布 Release(附带 zip 与两个 exe)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布的版本号(如 v0.1.0); 留空则只出 Artifacts 不发 Release"
        required: false
        default: ""

permissions:
  contents: write   # 发 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: 编译 release
        working-directory: src
        run: cargo build --release --bins

      - name: 打包 dist
        shell: pwsh
        run: |
          $dist = "dist/im-collector"
          New-Item -ItemType Directory -Force -Path "$dist/bin" | Out-Null
          Copy-Item "src/target/release/imc-wechat.exe"  "$dist/bin/"
          Copy-Item "src/target/release/imc-dingtalk.exe" "$dist/bin/"
          Copy-Item "imc.bat","build.bat","README.md" "$dist/"
          Copy-Item -Recurse "web","mcp","docs" "$dist/"
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/im-collector-windows-x64.zip" -Force
          Write-Host "打包完成:"; Get-ChildItem dist

      - name: 上传构建产物(Artifacts, 手动触发可在本次运行里下载)
        uses: actions/upload-artifact@v5
        with:
          name: im-collector-windows-x64
          path: |
            dist/im-collector-windows-x64.zip
            src/target/release/imc-wechat.exe
            src/target/release/imc-dingtalk.exe

      - name: 发布 Release(标签推送, 或手动填了 tag)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/im-collector-windows-x64.zip
            src/target/release/imc-wechat.exe
            src/target/release/imc-dingtalk.exe

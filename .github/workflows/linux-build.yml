name: linux-build

# 在 ubuntu runner 上编译 Linux x86_64 **musl 静态**二进制。
# 静态链接 => 一个文件在任何 Linux(Debian/liquorix/Ubuntu/Arch)都能跑, 不依赖 glibc 版本。
# - 手动触发(workflow_dispatch): 出可下载的 Artifacts; 填 tag 还会发 Release。
# - 推送 v* 标签: 自动编译并发布 Release(附带 tar.gz 与两个裸二进制)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布的版本号(如 v0.1.0); 留空则只出 Artifacts 不发 Release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust (stable) + musl 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: 安装 musl 工具链(编译 rusqlite bundled 的 C 需要)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: 编译 release (musl 静态)
        working-directory: src
        run: cargo build --release --bins --target ${{ env.TARGET }}

      - name: 打包 dist
        run: |
          DIST=dist/im-collector
          mkdir -p "$DIST/bin"
          install -m755 "src/target/$TARGET/release/imc-wechat"  "$DIST/bin/"
          install -m755 "src/target/$TARGET/release/imc-dingtalk" "$DIST/bin/"
          install -m755 imc.sh build.sh "$DIST/"
          cp README.md "$DIST/"
          cp -r web mcp docs deploy "$DIST/"
          tar -C dist -czf dist/im-collector-linux-x64.tar.gz im-collector
          echo "打包完成:"; ls -l dist

      - name: 上传构建产物(Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: im-collector-linux-x64
          path: |
            dist/im-collector-linux-x64.tar.gz
            src/target/${{ env.TARGET }}/release/imc-wechat
            src/target/${{ env.TARGET }}/release/imc-dingtalk

      - name: 发布 Release(标签推送, 或手动填了 tag)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/im-collector-linux-x64.tar.gz
            src/target/${{ env.TARGET }}/release/imc-wechat
            src/target/${{ env.TARGET }}/release/imc-dingtalk
